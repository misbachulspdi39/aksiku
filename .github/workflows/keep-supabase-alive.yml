name: Keep Supabase Alive

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan untuk menjalankan tes manual dari tab Actions GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          
          # Kirim request dan tampilkan HTTP Status Code saja
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase Response Status Code: $HTTP_STATUS"
          
          # Jika mendapat kode 200, 204, atau 401/404, artinya server Supabase menyala dan merespon
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "Supabase successfully pinged and alive!"
            exit 0
          else
            echo "Supabase returned server error $HTTP_STATUS"
            exit 1
          fi
