name: Keep Supabase Alive

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan untuk menjalankan tes manual dari tab Actions GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # Ambil URL dari secret dan hapus garis miring di akhir (jika ada)
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          
          # Eksekusi curl dengan proteksi header API key & Authorization
          curl -i -f -X GET "$URL/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
